name: Build and Release reMarkable App

on:
  push:
    branches: [ "main" ]

# Explicitly grant the token permission to create releases
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake wget xz-utils

      - name: Setup reMarkable Toolchain
        run: |
          wget https://storage.googleapis.com/remarkable-codex-toolchain/3.24.2.0/ferrari/remarkable-production-image-5.4.107-ferrari-public-x86_64-toolchain.sh
          chmod +x remarkable-production-image-5.4.107-ferrari-public-x86_64-toolchain.sh
          ./remarkable-production-image-5.4.107-ferrari-public-x86_64-toolchain.sh -y -d sdk

      - name: Configure, Build, and Rename
        run: |
          source sdk/environment-setup-cortexa53-crypto-remarkable-linux
          cmake . -B build
          cmake --build build
          
          mv build/anki build/anki_rmpp_24.2.0

      # Generate a timestamp (e.g., 2024-10-25_14-30-00) and save it to the environment variables
      - name: Generate Timestamp
        run: echo "TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_ENV

      # Use the pre-installed GitHub CLI to create the release and upload the asset
      - name: Create Release and Upload Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.TIMESTAMP }}" build/anki_rmpp_24.2.0 \
            --title "Build ${{ env.TIMESTAMP }}" \
            --notes "Automated release triggered by push to main branch."
